version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-toolchain:
        patterns:
          - '@vitejs/*'
          - vite
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
      testing:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
          - '@axe-core/*'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
